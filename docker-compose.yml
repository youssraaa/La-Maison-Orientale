# Developpement local complet
# Lance Postgres + pgAdmin + backend + frontend avec `docker compose up --build`

services:
  postgres:
    image: postgres:16-alpine
    container_name: lmo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-la_maison_orientale}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - lmo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-la_maison_orientale} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./lmoBack
      dockerfile: Dockerfile
    container_name: lmo-backend
    environment:
      TZ: Europe/Brussels
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Brussels
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-la_maison_orientale}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_RESTAURANT_TO: ${MAIL_RESTAURANT_TO:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-5357ef4109843d66b24a19167ff9d1a7be6ec7cc2573a338aa6aca565ab0bae4}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      LMO_ADMIN_EMAIL: ${LMO_ADMIN_EMAIL:-admin@lamaisonorientale.be}
      LMO_ADMIN_PASSWORD: ${LMO_ADMIN_PASSWORD:-admin123}
      LMO_ADMIN_NOM: ${LMO_ADMIN_NOM:-Administrateur}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lmo-network
    restart: unless-stopped

  frontend:
    build:
      context: ./lmoFront
      dockerfile: Dockerfile
    container_name: lmo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lmo-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lmo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lamaisonorientale.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lmo-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  lmo-network:
    driver: bridge
