spring.application.name=La Maison Orientale API
server.port=8080

# PostgreSQL (Docker local : port 5433 sur la machine hote)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:la_maison_orientale}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables deja creees par database/init/01_schema.sql — ne pas les recreer
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.lamaisonorientale=DEBUG

lmo.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# E-mail (Brevo SMTP — identifiants uniquement dans .env, jamais dans le code)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.from=${MAIL_FROM:}
mail.restaurant-to=${MAIL_RESTAURANT_TO:}
mail.restaurant-phone=${MAIL_RESTAURANT_PHONE:0498 67 22 62}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT (comme GLOP — secret Base64 via env, jamais committer la prod)
token.secret.key=${JWT_SECRET_KEY:5357ef4109843d66b24a19167ff9d1a7be6ec7cc2573a338aa6aca565ab0bae4}
token.expirationms=${JWT_EXPIRATION_MS:86400000}

# Compte admin initial (seed au démarrage si absent)
lmo.admin.email=${LMO_ADMIN_EMAIL:}
lmo.admin.password=${LMO_ADMIN_PASSWORD:}
lmo.admin.nom=${LMO_ADMIN_NOM:Administrateur}
